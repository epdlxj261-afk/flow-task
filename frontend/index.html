<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>Task Flow</h1>
      <div id="user-bar" class="user-bar" hidden>
        <span id="current-user" class="current-user"></span>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
    </header>

    <p id="api-error" class="api-error" role="alert" hidden></p>
    <p id="session-checking" class="empty-message">로그인 상태를 확인하는 중...</p>

    <section id="auth-view" class="auth-view" hidden>
      <div class="auth-tabs">
        <button id="show-login" type="button" class="auth-tab" aria-pressed="true">로그인</button>
        <button id="show-signup" type="button" class="auth-tab" aria-pressed="false">회원가입</button>
      </div>
      <form id="auth-form" class="auth-form" novalidate>
        <h2 id="auth-title">로그인</h2>
        <label class="auth-label" for="auth-username">아이디</label>
        <input id="auth-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
        <p id="username-hint" class="auth-hint" hidden>영문 소문자·숫자·밑줄(_) 4~20자</p>
        <label class="auth-label" for="auth-password">비밀번호</label>
        <input id="auth-password" type="password" autocomplete="current-password">
        <p id="password-hint" class="auth-hint" hidden>8~128자</p>
        <button id="auth-submit" type="submit">로그인</button>
        <p id="auth-message" class="auth-message" role="status"></p>
        <p id="auth-error" class="form-error" role="alert"></p>
      </form>
    </section>

    <div id="task-view" hidden>
    <form id="task-form" class="task-form" novalidate>
      <div class="form-row">
        <label for="task-title" class="visually-hidden">할 일 제목</label>
        <input id="task-title" type="text" placeholder="할 일 제목 (1~100자)" autocomplete="off">
        <button type="submit">등록</button>
      </div>
      <div class="form-row">
        <label class="field-label">
          우선순위
          <select id="task-priority">
            <option value="HIGH">높음</option>
            <option value="NORMAL" selected>보통</option>
            <option value="LOW">낮음</option>
          </select>
        </label>
        <label class="field-label">
          마감일
          <input id="task-due-date" type="date">
        </label>
      </div>
      <label for="task-description" class="visually-hidden">설명</label>
      <textarea id="task-description" rows="2" placeholder="설명 (선택, 최대 2000자)"></textarea>
    </form>
    <p id="form-error" class="form-error" role="alert"></p>

    <section>
      <h2>할 일 목록 <span id="task-count" class="task-count">0</span></h2>

      <div class="filter-bar">
        <label for="filter-query" class="visually-hidden">제목 검색</label>
        <input id="filter-query" type="search" placeholder="제목 검색" autocomplete="off">
        <label class="field-label">
          상태
          <select id="filter-status">
            <option value="">전체</option>
            <option value="TODO">할 일</option>
            <option value="DOING">진행 중</option>
            <option value="DONE">완료</option>
          </select>
        </label>
        <label class="field-label">
          우선순위
          <select id="filter-priority">
            <option value="">전체</option>
            <option value="HIGH">높음</option>
            <option value="NORMAL">보통</option>
            <option value="LOW">낮음</option>
          </select>
        </label>
      </div>

      <p id="empty-message" class="empty-message">불러오는 중...</p>
      <ul id="task-list" class="task-list"></ul>
    </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
