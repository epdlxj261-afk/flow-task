# T14: Web 서버 Nginx 설정. 화면(정적 파일)은 직접 제공하고 /api/는 App 서버로 전달한다.
# 설치: sudo ./scripts/setup_web_server.sh [App주소:포트] (APP_ADDRESS를 실제 주소로 바꿔 설치한다)
upstream task_flow_api {
    server APP_ADDRESS;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    root /var/www/task-flow;
    index index.html;

    # 제목 100자·설명 2000자 요청이면 충분하다.
    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ =404;
    }

    # .env 같은 숨김 파일은 제공하지 않는다.
    location ~ /\. {
        return 404;
    }

    location /api/ {
        # 주소 뒤에 경로를 붙이지 않아 /api/tasks가 그대로 App 서버로 간다.
        proxy_pass http://task_flow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # App의 DB 접속 대기(10초)보다 길게 기다려 503 응답을 그대로 전달한다.
        proxy_read_timeout 30s;
    }
}
